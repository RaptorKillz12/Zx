name: Extract Artifact to Branch

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions Run ID containing the artifact"
        required: true
        type: string
      artifact_name:
        description: "Exact artifact name to download"
        required: true
        type: string
      target_branch:
        description: "Branch to receive the extracted files"
        required: true
        default: "dream-team-data"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  extract-and-move:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: downloaded-artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Verify and Move Artifact Files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d downloaded-artifact ]; then
            echo "ERROR: downloaded-artifact folder was not created."
            exit 1
          fi

          if [ -z "$(find downloaded-artifact -type f -print -quit)" ]; then
            echo "ERROR: The selected artifact contains no files."
            exit 1
          fi

          mkdir -p extracted-data
          cp -a downloaded-artifact/. extracted-data/

          echo "Artifact files copied successfully."
          du -sh extracted-data

      - name: Install Git LFS and Track Large Files
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

          # GitHub rejects ordinary Git files larger than 100 MB.
          # Store files larger than 90 MB using Git LFS instead.
          while IFS= read -r -d '' file; do
            git lfs track "$file"
          done < <(find extracted-data -type f -size +90M -print0)

          echo "Git LFS tracking rules:"
          cat .gitattributes 2>/dev/null || true

      - name: Commit and Push
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Switch to the requested branch, creating it if it does not exist.
          git fetch origin "$TARGET_BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH"; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -B "$TARGET_BRANCH"
          fi

          git add .gitattributes extracted-data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract game data using Git LFS for large files"
            # Use the branch name directly; HEAD:branch is not a valid LFS ref.
            git lfs push origin "$TARGET_BRANCH"
            git push origin "$TARGET_BRANCH"
          fi
